<!doctype html>
<!-- data-theme picks the set of colors, fonts and sizes in css/theme.css -->
<html lang="en" data-theme="mono">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- The browser bar color can't read the theme's variables, so it repeats --bg (black) here -->
  <meta name="theme-color" content="#000000">

  <!-- Lets the app run full-screen when added to the iPhone home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "black" = a solid status bar with the page starting below it. ("black-translucent" put the
       header under the status bar, where iOS blurs whatever is beneath it.) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GitFit">
  <link rel="manifest" href="manifest.json">
  <!-- The home-screen icon (drawn from icons/icon.svg). iPhone keeps the icon it saw when the app
       was added, so a new icon only shows after removing the app and adding it again. -->
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <!-- The theme (every color, font, radius and size) first, then the styling that uses it -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/styles.css">
  <title>GitFit</title>
</head>
<body>
  <!-- Solid strip behind the iPhone status bar; only has height if the page is drawn under it -->
  <div class="status-cap" aria-hidden="true"></div>

  <header class="topbar">
    <button id="back" class="back-btn" hidden>&lsaquo; Back</button>
    <h1 id="title">GitFit</h1>
    <a id="history-link" class="top-link" href="#/history" hidden>Past workouts</a>
    <!-- Workout timer (workout screens only): elapsed time, "Paused", and pause/resume. Filled in by app.js. -->
    <div id="timer" class="top-timer" hidden>
      <span class="timer-paused" data-timer-paused hidden>Paused</span>
      <span class="timer-time" data-timer>0:00</span>
      <button type="button" id="timer-btn" class="timer-btn" data-action="timer-toggle" aria-label="Pause timer"></button>
    </div>
    <a id="gear" class="gear-btn" href="#/settings" aria-label="Settings" hidden>
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </a>
  </header>

  <!-- Each screen is drawn into here by js/app.js -->
  <main id="app"></main>

  <!-- Bottom tab bar, filled in from TABS in js/tabs.js -->
  <nav id="tabbar" class="tabbar" aria-label="Main"></nav>

  <div id="toast" class="toast" hidden></div>

  <!-- Full-screen streak celebration or streak notice, drawn by js/app.js -->
  <div id="overlay" class="overlay" hidden></div>

  <!-- Order matters: library and storage first, then the helpers, then the app that uses them -->
  <script src="js/library.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/units.js"></script>
  <script src="js/cardio.js"></script>
  <script src="js/standards.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/streak.js"></script>
  <script src="js/bodymap.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
