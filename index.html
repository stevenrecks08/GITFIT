<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">

  <!-- Lets the app run full-screen when added to the iPhone home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GitFit">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="css/styles.css">
  <title>GitFit</title>
</head>
<body>
  <header class="topbar">
    <button id="back" class="back-btn" hidden>&lsaquo; Back</button>
    <h1 id="title">GitFit</h1>
  </header>

  <!-- Each screen is drawn into here by js/app.js -->
  <main id="app"></main>

  <!-- Bottom tab bar, filled in from TABS in js/tabs.js -->
  <nav id="tabbar" class="tabbar" aria-label="Main"></nav>

  <div id="toast" class="toast" hidden></div>

  <!-- Order matters: storage first, then the helpers, then the app that uses them -->
  <script src="js/storage.js"></script>
  <script src="js/units.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
